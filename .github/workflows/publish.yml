name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Mints the OIDC token that signs the provenance attestation.
      # The registry credential is separate: secrets.NPM_TOKEN.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, so that the tagged commit can be checked against origin/main.
          fetch-depth: 0

      - name: Tag is annotated and holds the release notes
        run: |
          set -euo pipefail
          # The checkout can leave only the commit; fetch the tag object itself.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; tag with git tag -a --cleanup=verbatim -F notes.md $GITHUB_REF_NAME"
            exit 1
          fi
          notes="$(git for-each-ref --format='%(contents:subject)%(contents:body)' "refs/tags/${GITHUB_REF_NAME}")"
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::$GITHUB_REF_NAME has an empty message; the message is the release notes"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json and is on main
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on origin/main; refusing to publish an unmerged commit"
            exit 1
          fi

      - name: Version is not already on the registry
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create the release from the tag message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; nothing to do"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
